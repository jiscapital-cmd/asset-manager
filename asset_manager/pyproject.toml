[project]
name = "asset-manager"
version = "0.1.0"
description = "Operational asset management deep agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.6.12",
    "langchain-openai>=1.3.3",
    "langgraph-cli[inmem]>=0.4.30",
    "chromadb>=0.5",
    "google-api-python-client>=2.140",
    "google-auth>=2.34",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "streamlit>=1.38",
    "python-dotenv>=1.0",
    "reportlab>=4.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asset_manager"]
