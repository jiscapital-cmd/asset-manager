# PrimeAsset Realty Management theme: warm off-white "paper" canvas with a
# single teal brand ramp (teal-700 primary, teal-800 deep, teal-50/100/200
# tints), a slate "ink" text ramp, Inter throughout, and soft rounded
# corners. Users can switch light/dark from the app's settings menu since
# both [theme.light] and [theme.dark] are defined.

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15
baseFontWeight = 400
codeFontSize = "0.85rem"
headingFontSizes = ["30px", "24px", "20px", "17px", "15px", "13px"]
headingFontWeights = [700, 700, 600, 600, 600, 600]
linkUnderline = false
baseRadius = "14px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true

[theme.light]
primaryColor = "#0f766e"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#f0fdfa"
textColor = "#0f172a"
borderColor = "#e2e8f0"
linkColor = "#0f766e"
codeBackgroundColor = "#f0fdfa"
codeTextColor = "#0f172a"
dataframeBorderColor = "#e2e8f0"
dataframeHeaderBackgroundColor = "#f0fdfa"

redColor = "#e11d48"
orangeColor = "#f59e0b"
yellowColor = "#eab308"
greenColor = "#0f766e"
blueColor = "#0ea5e9"
violetColor = "#7c3aed"
grayColor = "#64748b"

chartCategoricalColors = ["#0f766e", "#14b8a6", "#99f6e4", "#115e59", "#64748b", "#94a3b8", "#0ea5e9"]

[theme.dark]
primaryColor = "#2dd4bf"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#134e4a"
textColor = "#f0fdfa"
borderColor = "#1e293b"
linkColor = "#2dd4bf"
codeBackgroundColor = "#134e4a"
codeTextColor = "#f0fdfa"
dataframeBorderColor = "#1e293b"
dataframeHeaderBackgroundColor = "#134e4a"

redColor = "#fb7185"
orangeColor = "#fbbf24"
yellowColor = "#facc15"
greenColor = "#2dd4bf"
blueColor = "#38bdf8"
violetColor = "#a78bfa"
grayColor = "#94a3b8"

chartCategoricalColors = ["#2dd4bf", "#99f6e4", "#0f766e", "#5eead4", "#94a3b8", "#64748b", "#38bdf8"]

[theme.light.sidebar]
backgroundColor = "#f0fdfa"
secondaryBackgroundColor = "#ccfbf1"
textColor = "#0f172a"
borderColor = "#99f6e4"
primaryColor = "#0f766e"

[theme.dark.sidebar]
backgroundColor = "#134e4a"
secondaryBackgroundColor = "#115e59"
textColor = "#f0fdfa"
borderColor = "#0f766e"
primaryColor = "#2dd4bf"
