<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 530" role="img"
     aria-label="The orchestrator's two-wave delegation: financial-agent, pm-agent, and capex-agent run in parallel in wave one, a gate waits for all three to return, then risk-agent runs alone in wave two, reading the prior report before producing the final cited report.">
  <title>Asset Manager — Two-Wave Delegation</title>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#59697A"></path>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B85C2E"></path>
    </marker>
    <style>
      text { font-family: 'IBM Plex Mono', 'Consolas', monospace; }
      .node-title { font-weight: 600; font-size: 13px; fill: #1F2E3A; }
      .node-sub { font-family: 'IBM Plex Sans', Arial, sans-serif; font-size: 10.5px; fill: #59697A; }
      .node-box { fill: #FFFFFF; stroke: #C7CDD3; stroke-width: 1.3; }
      .lane-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; fill: #59697A; }
      .arrow-line { stroke: #59697A; stroke-width: 1.4; fill: none; }
      .arrow-line.accent { stroke: #B85C2E; stroke-width: 1.8; }
      .arrow-line.dashed { stroke-dasharray: 3 4; }
      .arrow-label { font-size: 10.5px; fill: #59697A; }
      .arrow-label.accent { fill: #B85C2E; font-weight: 600; }
      .tick { stroke: #B85C2E; stroke-width: 1.4; }
    </style>
  </defs>

  <rect width="1040" height="530" fill="#F6F3EC"></rect>

  <rect x="420" y="20" width="200" height="70" rx="7" class="node-box"></rect>
  <text x="520" y="50" text-anchor="middle" class="node-title">Orchestrator</text>
  <text x="520" y="66" text-anchor="middle" class="node-sub">per property_id</text>

  <text x="520" y="140" text-anchor="middle" class="lane-label">WAVE 1 · PARALLEL</text>

  <rect x="40" y="160" width="240" height="70" rx="7" class="node-box"></rect>
  <text x="160" y="190" text-anchor="middle" class="node-title">financial-agent</text>
  <text x="160" y="206" text-anchor="middle" class="node-sub">budget · NOI · projection</text>

  <rect x="420" y="160" width="200" height="70" rx="7" class="node-box"></rect>
  <text x="520" y="190" text-anchor="middle" class="node-title">pm-agent</text>
  <text x="520" y="206" text-anchor="middle" class="node-sub">occupancy · leasing</text>

  <rect x="760" y="160" width="240" height="70" rx="7" class="node-box"></rect>
  <text x="880" y="190" text-anchor="middle" class="node-title">capex-agent</text>
  <text x="880" y="206" text-anchor="middle" class="node-sub">deferred maint · capital plan</text>

  <line x1="480" y1="90" x2="185" y2="155" class="arrow-line" marker-end="url(#arrow2)"></line>
  <line x1="520" y1="90" x2="520" y2="155" class="arrow-line" marker-end="url(#arrow2)"></line>
  <line x1="560" y1="90" x2="855" y2="155" class="arrow-line" marker-end="url(#arrow2)"></line>

  <!-- gate -->
  <line x1="40" y1="270" x2="1000" y2="270" class="arrow-line accent dashed"></line>
  <line x1="160" y1="230" x2="160" y2="270" class="tick"></line>
  <line x1="520" y1="230" x2="520" y2="270" class="tick"></line>
  <line x1="880" y1="230" x2="880" y2="270" class="tick"></line>
  <text x="1010" y="274" text-anchor="start" class="arrow-label accent">gate</text>

  <line x1="520" y1="270" x2="520" y2="315" class="arrow-line accent" marker-end="url(#arrow-accent)"></line>
  <text x="534" y="298" text-anchor="start" class="arrow-label accent">after all 3 return</text>

  <rect x="40" y="320" width="240" height="70" rx="7" class="node-box"></rect>
  <text x="160" y="350" text-anchor="middle" class="node-title">get_prior_report</text>
  <text x="160" y="366" text-anchor="middle" class="node-sub">history-diff source</text>

  <rect x="420" y="320" width="200" height="70" rx="7" class="node-box"></rect>
  <text x="520" y="350" text-anchor="middle" class="node-title">risk-agent</text>
  <text x="520" y="366" text-anchor="middle" class="node-sub">severity + change vs. prior</text>

  <line x1="280" y1="355" x2="415" y2="355" class="arrow-line" marker-end="url(#arrow2)"></line>
  <text x="348" y="345" text-anchor="middle" class="arrow-label">prior report</text>

  <rect x="420" y="450" width="200" height="70" rx="7" class="node-box"></rect>
  <text x="520" y="480" text-anchor="middle" class="node-title">Final Report</text>
  <text x="520" y="496" text-anchor="middle" class="node-sub">cited · labeled projections</text>

  <line x1="520" y1="390" x2="520" y2="445" class="arrow-line" marker-end="url(#arrow2)"></line>
  <text x="534" y="420" text-anchor="start" class="arrow-label">synthesizes</text>
</svg>
